name: Xiaohongshu to YouTube Shorts & Facebook Reels Auto Reup

on:
  schedule:
    # Quét dự phòng các mốc giờ vàng trong ngày theo giờ Việt Nam (UTC+7):
    # - 12:30 trưa VN (05:30 UTC)
    # - 19:15 tối VN (12:15 UTC)
    # - 20:15 tối VN (13:15 UTC)
    # - 21:15 tối VN (14:15 UTC)
    # - 22:15 tối VN (15:15 UTC)
    - cron: '30 5 * * *'
    - cron: '15 12 * * *'
    - cron: '15 13 * * *'
    - cron: '15 14 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch:
    # Cho phép bấm chạy thủ công bất cứ lúc nào trên GitHub Actions
    inputs:
      force:
        description: 'Bỏ qua giới hạn 1 video/ngày và ép đăng ngay lập tức'
        required: false
        default: false
        type: boolean
      order:
        description: 'Thứ tự lấy video (oldest_first: từ cũ nhất đến mới nhất, newest_first: từ mới nhất)'
        required: false
        default: 'oldest_first'
        type: choice
        options:
          - oldest_first
          - newest_first

permissions:
  contents: write

jobs:
  auto_reup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install FFmpeg & ffprobe (Static Build)
        run: |
          curl -sL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/
          sudo cp /tmp/ffmpeg-*/bin/ffmpeg /tmp/ffmpeg-*/bin/ffprobe /usr/local/bin/
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          rm -rf /tmp/ffmpeg*
          ffmpeg -version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install chromium

      - name: Run Xiaohongshu -> YouTube Shorts Pipeline
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          REUP_ORDER: ${{ inputs.order || 'oldest_first' }}
          FORCE_RUN: ${{ inputs.force || false }}
        run: |
          EXTRA_FLAGS=""
          if [ "$FORCE_RUN" = "true" ]; then
            EXTRA_FLAGS="--force"
          fi
          python main.py --order "$REUP_ORDER" $EXTRA_FLAGS

      - name: Commit & Push Updated History
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(bot): update processed notes history [skip ci]"
          file_pattern: "history.json"
