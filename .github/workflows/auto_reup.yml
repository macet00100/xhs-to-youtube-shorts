name: Xiaohongshu to YouTube Shorts & Facebook Reels Auto Reup

on:
  schedule:
    # Chạy mỗi ngày lúc 19:00 giờ Việt Nam (12:00 UTC) - Đều đặn 1 video / ngày
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Cho phép bấm chạy thủ công bất cứ lúc nào trên GitHub Actions
    inputs:
      order:
        description: 'Thứ tự lấy video (oldest_first: từ cũ nhất đến mới nhất, newest_first: từ mới nhất)'
        required: false
        default: 'oldest_first'
        type: choice
        options:
          - oldest_first
          - newest_first

permissions:
  contents: write

jobs:
  auto_reup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium with System Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run Xiaohongshu -> YouTube Shorts Pipeline
        env:
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          REUP_ORDER: ${{ inputs.order || 'oldest_first' }}
        run: |
          python main.py --order "$REUP_ORDER"

      - name: Commit & Push Updated History
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(bot): update processed notes history [skip ci]"
          file_pattern: "history.json"
